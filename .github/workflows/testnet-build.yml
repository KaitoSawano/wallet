# Build a ZeeyGo apk for Mainnet, using the master branch.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master, test-ci-build ]
    paths:
      - 'zeeygo-android/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # 1 - checkout project and dependencies

    - name: Checkout ZeeyGo
      uses: actions/checkout@v2
      with:
        path: zeeygo

    - name: Checkout lightning-kmp
      uses: actions/checkout@v2
      with:
        repository: ACINQ/lightning-kmp
        ref: master
        path: lightning-kmp

    # 2 - setup cache/jdk

    - name: Cached Konan
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-konan-

    - name: Set up jdk 1.17
      uses: actions/setup-java@v1
      with:
        java-version: 17

    # 3 - build dependencies & app

    - name: Build lightning-kmp and install to local maven repo
      run: |
        cd lightning-kmp
        ./gradlew clean build publishToMavenLocal -x check

    - name: Assemble the android apk
      run: |
        cd zeeygo
        ./gradlew clean
        printf "\nskip.android=false" >> local.properties
        ./gradlew :zeeygo-android:assembleDebug --stacktrace

    # 4 - prepare artifact folder

    - name: Prepare artifact
      run: |
        mkdir upload
        mv zeeygo/zeeygo-android/build/outputs/apk/debug/zeeygo-*.apk upload/zeeygo-mainnet-latest.apk
      shell: bash

    # 5 - upload apk to GitHub Actions

    - name: Upload apk as artifact for this action
      uses: actions/upload-artifact@v4
      with:
        name: zeeygo-mainnet
        path: upload/zeeygo-mainnet-latest.apk
